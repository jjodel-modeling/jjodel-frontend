<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lanes</title>
  <link rel="stylesheet" href="popover.css">
</head>
<body>
  <main id="pop">
    <header class="head">
      <button type="button" class="icon-btn" id="back" aria-label="Back to lanes" hidden>
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 id="title">Lanes</h1>
      <span class="status" id="status" role="status">
        <span class="dot dot-pending" id="dot" aria-hidden="true"></span>
        <span id="synced">connecting</span>
      </span>
      <button type="button" class="icon-btn" id="gear" aria-label="Settings" title="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><g fill="none" stroke="currentColor"><circle cx="8" cy="8" r="3.6" stroke-width="1.4"/><circle cx="8" cy="8" r="1.3" stroke-width="1.2"/><path stroke-width="2.2" d="M12.2 8H14M8 12.2V14M3.8 8H2M8 3.8V2M11 11l1.24 1.24M5 11l-1.24 1.24M5 5 3.76 3.76M11 5l1.24-1.24"/></g></svg>
      </button>
    </header>

    <div id="lanes-view">
    <section class="counts" aria-label="Counts">
      <div class="count count-waiting"><span class="n" id="n-waiting">&#8211;</span><span class="l">waiting for you</span></div>
      <div class="count count-blocked"><span class="n" id="n-blocked">&#8211;</span><span class="l">blocked</span></div>
      <div class="count count-running"><span class="n" id="n-running">&#8211;</span><span class="l">running</span></div>
    </section>

    <p class="notice" id="notice" hidden></p>

    <section class="block" id="waiting-sec" hidden>
      <h2>Waiting for you, oldest first</h2>
      <ul class="rows" id="waiting-list"></ul>
      <button type="button" class="more" id="more" hidden></button>
    </section>

    <p class="stale" id="stale" hidden></p>

    <section class="block" id="running-sec" hidden>
      <h2>Running</h2>
      <ul class="rows" id="running-list"></ul>
    </section>

    <footer class="foot">
      <button type="button" class="btn btn-primary" id="open">Open monitor</button>
      <button type="button" class="btn" id="restart" disabled aria-describedby="restart-why">Restart board</button>
      <button type="button" class="btn btn-text" id="quit" aria-label="Quit Lane Monitor">Quit</button>
    </footer>
    <p class="more" id="restart-why" hidden></p>
    <p class="foot-note" id="foot-note" hidden></p>
    </div>

    <form class="settings" id="settings-view" hidden novalidate>
      <fieldset class="field">
        <legend>Theme</legend>
        <div class="seg">
          <label><input type="radio" name="theme" value="system"> System</label>
          <label><input type="radio" name="theme" value="light"> Light</label>
          <label><input type="radio" name="theme" value="dark"> Dark</label>
        </div>
      </fieldset>
      <div class="field">
        <label for="board">Board URL</label>
        <input class="input mono" id="board" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" aria-describedby="board-err board-note">
        <p class="field-err" id="board-err" hidden></p>
        <p class="hint" id="board-note" hidden></p>
      </div>
      <div class="field">
        <label for="shortcut">Global shortcut</label>
        <input class="input mono" id="shortcut" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" aria-describedby="shortcut-err shortcut-hint">
        <p class="field-err" id="shortcut-err" hidden></p>
        <p class="hint" id="shortcut-hint">Ctrl, Alt, Shift, Cmd and a key, as Ctrl+Alt+Cmd+L; empty for none.</p>
      </div>
      <div class="save-row">
        <button type="submit" class="btn btn-primary" id="save">Save</button>
        <span class="hint" id="saved" role="status"></span>
      </div>
      <div class="toggles">
        <label class="toggle" id="login-label"><input type="checkbox" id="login" aria-label="Start at login" disabled> Start at login</label>
        <label class="toggle" id="notifications-label"><input type="checkbox" id="notifications"> Notifications</label>
      </div>
      <p class="field-err" id="file-err" hidden></p>
      <p class="hint path" id="path-line"><span class="path-label">Saved in</span><span class="mono path-head" id="path-head"></span><span class="mono path-tail" id="path-tail"></span></p>
    </form>
  </main>
  <script src="popover.js"></script>
</body>
</html>
