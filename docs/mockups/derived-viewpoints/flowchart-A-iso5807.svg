<text class="sm" x="400" y="73" text-anchor="middle">Start</text>
<text class="sm" x="400" y="155" text-anchor="middle">read n</text>
<text class="sm" x="400" y="239" text-anchor="middle">i := 0,  s := 0</text>
<text class="sm" x="400" y="345" text-anchor="middle">i &lt; n ?</text>
<text class="sm" x="400" y="465" text-anchor="middle">s := s + i,  i := i + 1</text>
